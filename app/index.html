}

function runRecurring() {

    var end = new Date(start); end.setDate(end.getDate() + 7); var last = new Date(end); last.setDate(last.getDate() - 1);
    var f = function (d) { return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
    return { from: dayStr(start), to: dayStr(end), title: f(start) + " to " + f(last) };
  }
  return BK.year ? { from: dayStr(new Date(y, 0, 1)), to: dayStr(new Date(y + 1, 0, 1)), title: String(y) } : { from: dayStr(new Date(y, m, 1)), to: dayStr(new Date(y, m + 1, 1)), title: BK.d.toLocaleDateString(undefined, { month: "long", year: "numeric" }) };

function tally(rows, key, val) { var t = {}; rows.forEach(function (r) { var k = key(r); t[k] = (t[k] || 0) + val(r); }); return Object.keys(t).map(function (k) { return { name: k, cents: t[k] }; }).sort(function (a, b) { return b.cents - a.cents; }); }

  var fam = sum(pays, function (p) { return p.amount_cents; }), ot = sum(oth, function (o) { return o.amount_cents; }), ex = sum(exp, function (e) { return e.amount_cents; });
  return { pays: pays, oth: oth, exp: exp, income: fam + ot, expense: ex, profit: fam + ot - ex,
    byMethod: tally(pays.concat(oth), function (x) { return METHODS[x.method] || "Other"; }, function (x) { return x.amount_cents; }),

function lessonsTab(id, box) {

  var all = lessonsOf(id), upcoming = all.filter(function (l) { return !isPast(l); }), past = all.filter(isPast).reverse();
  function draw() {
    var html = '<div class="seg">' + [["upcoming", "Upcoming"], ["calendar", "Calendar"], ["history", "History"]].map(function (m) { return '<button data-mode="' + m[0] + '" class="' + (mode === m[0] ? "on" : "") + '">' + m[1] + '</button>'; }).join("") + '</div>';
    if (mode === "upcoming") {
      html += '<h3 style="font-size:17px;margin:14px 0 4px">Coming up</h3>';
      var list = upcoming;
      if (coach) {
        var np = upcoming.filter(isPrivate).length, ng = upcoming.length - np;
        html += '<div class="seg"><button data-kind="Privates" class="' + (kind === "Privates" ? "on" : "") + '">Privates (' + np + ')</button><button data-kind="Groups" class="' + (kind === "Groups" ? "on" : "") + '">Groups (' + ng + ')</button></div>';
        list = upcoming.filter(function (l) { return kind === "Privates" ? isPrivate(l) : !isPrivate(l); });
      }
      html += list.length ? list.map(function (l) { return lessonRow(l, false); }).join("") : '<div class="empty">' + (coach ? "Nothing coming up here." : "No lessons scheduled. Your coach will add lessons here.") + '</div>';
    } else if (mode === "calendar") {
      html += monthGrid(month, marksFor(all), sel);
      var dl = all.filter(function (l) { return sameDay(l.start_at, sel); });
      html += '<h3 style="font-size:17px;margin:16px 0 4px">' + esc(fmtDate(sel, { weekday: "long", month: "long", day: "numeric" })) + '</h3>' + (dl.length ? dl.map(function (l) { return lessonRow(l, isPast(l)); }).join("") : '<div class="muted">Nothing scheduled this day.</div>');
    } else {
      html += '<div class="row c" style="margin:14px 0 4px"><h3 class="grow" style="font-size:17px;margin:0">Past lessons</h3><span class="small muted">' + past.length + ' so far</span></div>';
      if (!past.length) html += '<div class="empty">No past lessons yet. Every lesson, with its plan and recap, lands here after it happens.</div>';
      else {
        var lastM = "";
        past.forEach(function (l) {
          var mk = new Date(l.start_at).toLocaleDateString(undefined, { month: "long", year: "numeric" });
          if (mk !== lastM) { html += '<div class="dh">' + esc(mk) + '</div>'; lastM = mk; }
          html += lessonRow(l, true);
        });
      }
    }
    box.innerHTML = html;
  }
  box.onclick = function (e) {
    var t;
    if ((t = e.target.closest("[data-mode]"))) { mode = t.dataset.mode; draw(); }
    else if ((t = e.target.closest("[data-kind]"))) { kind = t.dataset.kind; draw(); }
    else if ((t = e.target.closest("[data-m]"))) { month = new Date(month.getFullYear(), month.getMonth() + (+t.dataset.m), 1); draw(); }
    else if ((t = e.target.closest("[data-d]"))) { sel = startOfDay(new Date(+t.dataset.d)); draw(); }
    else if ((t = e.target.closest("[data-l]"))) openLessonById(t.dataset.l);
  };
  draw();
}

function tintOf(m) { var h = 0, s = String(m.id); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return TINTS[h % TINTS.length]; }

  var k = m.kind, asp = k === "clip" ? "4/5" : k === "youtube" ? "16/9" : "9/14", t = tintOf(m);

function openMedia(m) {

    (/^https?:\/\//.test(m.link || "") ? '<a class="btn ghost" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="' + esc(m.link) + '" target="_blank" rel="noopener">Open on ' + (m.kind === "instagram" ? "Instagram" : "YouTube") + '</a>' : ""), null);

function mediaTab(id, box, which) {

function reportTab(id, box) {
  var s = studentById(id), now = new Date(), mo = new Date(now.getFullYear(), now.getMonth(), 1);
  return Promise.all([api("progress?student_id=eq." + id + "&select=*"), api("media?student_id=eq." + id + "&select=id,created_at")]).then(function (r) {
    var ps = r[0], clips = r[1];
    function draw() {
      var a = mo.getTime(), b = new Date(mo.getFullYear(), mo.getMonth() + 1, 1).getTime();
      var inM = function (d) { var t = new Date(d).getTime(); return t >= a && t < b; };
      var ls = lessonsOf(id).filter(function (l) { return inM(l.start_at); });
      var played = ls.filter(isPast), hw = 0, hwDone = 0, hrs = 0;
      played.forEach(function (l) { hrs += (l.minutes || 60) / 60; });
      ls.forEach(function (l) { hwOf(l).forEach(function (i) { hw++; if (i.done) hwDone++; }); });
      var ns = S.notes.filter(function (n) { return n.student_id === id && inM(n.note_date); });
      var tt = S.tourn.filter(function (t) { return t.student_id === id && inM(t.event_date); });
      var nm = clips.filter(function (c) { return inM(c.created_at); }).length;
      function st(n, l) { return '<div class="card" style="margin:0"><div style="font-weight:800;font-size:24px;color:var(--court)">' + n + '</div><div class="small muted">' + l + '</div></div>'; }
      var h = '<div class="nav noprint" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><button class="circ" id="pm">' + ico("back", 16) + '</button><div style="font-weight:700">' + esc(mo.toLocaleDateString(undefined, { month: "long", year: "numeric" })) + '</div><button class="circ" id="nx">' + ico("chev", 16) + '</button></div>' +
        '<div class="card"><div class="cap">Monthly report</div><h2 style="margin:2px 0">' + esc(s.name) + '</h2><div class="small muted">' + esc(academyOf(s)) + '</div></div>' +
        '<div class="g2">' + st(played.length, "Lessons played") + st(Math.round(hrs * 10) / 10, "Hours on court") + st(hw ? hwDone + " of " + hw : "None", "Homework done") + st(nm, "Videos shared") + '</div>';
      h += '<h2>Skills</h2>' + (ps.length ? ps.map(function (p) { var pct = Math.round(Math.max(0, Math.min(1, p.level)) * 100); return '<div class="card"><div class="row" style="justify-content:space-between"><b>' + esc(p.skill) + '</b><b>' + pct + '%</b></div><div class="bar"><i style="width:' + pct + '%"></i></div>' + (p.comment ? '<div class="muted small" style="margin-top:6px">' + esc(p.comment) + '</div>' : '') + '</div>'; }).join("") : '<div class="card empty">No skill progress yet.</div>');
      if (ns.length) h += '<h2>Coach notes</h2>' + ns.map(function (n) { return '<div class="card"><b>' + esc(n.title) + '</b><div class="small muted">' + esc(fmtDate(n.note_date, { month: "short", day: "numeric" })) + '</div><div class="small" style="margin-top:4px">' + esc(plain(n.summary).slice(0, 400)) + '</div></div>'; }).join("");
      if (tt.length) h += '<h2>Tournaments</h2>' + tt.map(function (t) { return '<div class="card"><b>' + esc(t.name) + '</b><div class="small muted">' + esc(fmtDate(t.event_date, { month: "short", day: "numeric" })) + (t.location ? " &middot; " + esc(t.location) : "") + '</div></div>'; }).join("");
      h += '<button class="btn noprint" id="pr" style="margin-top:14px">Print or save as PDF</button>';
      box.innerHTML = h;
      $("#pm").onclick = function () { mo = new Date(mo.getFullYear(), mo.getMonth() - 1, 1); draw(); };
      $("#nx").onclick = function () { mo = new Date(mo.getFullYear(), mo.getMonth() + 1, 1); draw(); };
      $("#pr").onclick = function () { window.print(); };
    }
    draw();
  });
}

function chatTab(s, box) {
  box.innerHTML = '<div class="chat" id="chat"></div><div class="compose"><input id="txt" placeholder="Message" autocomplete="off"><button class="btn" id="send">Send</button></div>';
  var shown = {}, first = true;
  function load() {
    return api("messages?student_id=eq." + s.id + "&order=created_at.asc&select=*").then(function (ms) {
      var c = $("#chat"); if (!c) return;
      var nearBottom = first || (window.innerHeight + window.scrollY >= document.body.scrollHeight - 120), added = false;
      ms.forEach(function (m) {
        if (shown[m.id]) return; shown[m.id] = 1; added = true;
        var me = m.author_id === S.session.user.id, d = document.createElement("div");
        d.className = "msg" + (me ? " me" : ""); d.innerHTML = '<small>' + esc(m.author_name) + ' &middot; ' + fmtDate(m.created_at, { month: "short", day: "numeric" }) + ' ' + fmtTime(m.created_at) + '</small>' + esc(m.body);
        c.appendChild(d);
      });
      if (!ms.length && first) c.innerHTML = '<div class="empty">No messages yet. Say hi.</div>';
      if (added && c.querySelector(".empty")) c.querySelector(".empty").remove();
      if (added && nearBottom) window.scrollTo(0, document.body.scrollHeight);
      first = false;
    });
  }
  function send() {
    var t = $("#txt"), v = t.value.trim(); if (!v) return;
    t.value = "";
    api("messages", { json: { student_id: s.id, author_id: S.session.user.id, author_name: S.profile.display_name || "Me", author_role: S.profile.role === "coach" ? "coach" : "parent", body: v }, prefer: "return=minimal" })
      .then(load).catch(function (e) { t.value = v; alert(e.message); });
  }
  $("#send").onclick = send; $("#txt").onkeydown = function (e) { if (e.key === "Enter") send(); };
  chatTimer = setInterval(function () { load().catch(function () {}); }, 4000);
  return load();
}

  var html = '<div class="row c" style="margin:14px 0 4px"><h1 class="grow" style="margin:0">Schedule</h1><button class="pill" id="syncbtn" style="margin-right:6px">Sync</button><button class="pill" data-a="today">Today</button></div>';
  if (S.students.length > 1) html += '<div class="chips" style="margin-top:6px"><button class="lg' + (Object.keys(calFilter).some(function (k) { return calFilter[k]; }) ? "" : " on") + '" data-f="" style="border-color:' + (Object.keys(calFilter).some(function (k) { return calFilter[k]; }) ? "transparent" : "var(--muted)") + '"><b style="background:var(--muted)"></b>Everyone</button>' +
    S.students.map(function (s) { var on = calFilter[s.id], c = colorOf(s.id); return '<button class="lg" data-f="' + s.id + '" style="border-color:' + (on ? c : "transparent") + ';background:' + (on ? c + "2e" : "var(--card)") + '"><b style="background:' + c + '"></b>' + esc(s.name) + '</button>'; }).join("") + '</div>';
  html += '<div class="seg">' + [["day", "Day"], ["week", "Week"], ["month", "Month"], ["upcoming", "Upcoming"]].map(function (m) { return '<button data-mode="' + m[0] + '" class="' + (calMode === m[0] ? "on" : "") + '">' + m[1] + '</button>'; }).join("") + '</div>';
  var marks = marksFor(all);
  function strip() {
    var days = weekDaysOf(calDay), t = days[0].toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " to " + days[6].toLocaleDateString(undefined, { month: "short", day: "numeric" });
    return '<div class="nav"><button class="circ" data-s="-7">' + ico("back", 16) + '</button><div class="t">' + esc(t) + '</div><button class="circ" data-s="7">' + ico("chev", 16) + '</button></div><div class="wkstrip">' + days.map(function (d) {
      var cols = (marks[d.toDateString()] || []).slice(0, 3);
      return '<button data-d="' + d.getTime() + '"><small>' + d.toLocaleDateString(undefined, { weekday: "narrow" }) + '</small><span class="dn' + (sameDay(d, calDay) ? " sel" : "") + (sameDay(d, new Date()) ? " today" : "") + '">' + d.getDate() + '</span><span class="dots">' + cols.map(function (c) { return '<i style="background:' + c + '"></i>'; }).join("") + '</span></button>';
    }).join("") + '</div>';
  }
  var dayLs = all.filter(function (l) { return sameDay(l.start_at, calDay); });
  if (calMode === "day") {
    html += strip();
    var mins = dayLs.reduce(function (a, l) { return a + l.minutes; }, 0), dt = sameDay(calDay, new Date()) ? "Today" : fmtDate(calDay, { weekday: "long", month: "short", day: "numeric" });
    var onc = (mins >= 60 ? Math.floor(mins / 60) + "h" : "") + (mins % 60 ? (mins >= 60 ? " " : "") + (mins % 60) + "m" : "");
    html += '<div class="sum"><div><div class="t">' + esc(dt) + '</div><div class="u">' + (dayLs.length ? dayLs.length + (dayLs.length === 1 ? " lesson" : " lessons") + ", " + onc + " on court" : "Nothing scheduled") + '</div></div>' + (dayLs.length ? '<div class="r">' + esc(fmtTime(dayLs[0].start_at)) + ' to ' + esc(fmtTime(lEnd(dayLs[dayLs.length - 1]))) + '</div>' : "") + '</div>';
    html += '<div id="plnr"></div>';
    if (dayLs.length) html += '<h2>Lessons</h2>' + dayLs.map(agendaCard).join("");
  } else if (calMode === "week") {
    html += strip() + '<div class="wk" style="margin-top:10px">' + weekDaysOf(calDay).map(function (d) {
      var ls = all.filter(function (l) { return sameDay(l.start_at, d); });
      return '<div><div class="dh' + (sameDay(d, new Date()) ? " today" : "") + '">' + esc(fmtDate(d, { weekday: "long", month: "short", day: "numeric" })) + '</div>' + (ls.length ? ls.map(agendaCard).join("") : '<div class="muted small">Nothing scheduled.</div>') + '</div>';
    }).join("") + '</div>';
  } else if (calMode === "month") {
    html += monthGrid(calDay, marks, calDay) + '<div class="dh' + (sameDay(calDay, new Date()) ? " today" : "") + '" style="margin-top:16px">' + esc(fmtDate(calDay, { weekday: "long", month: "long", day: "numeric" })) + '</div>' + (dayLs.length ? dayLs.map(agendaCard).join("") : '<div class="muted small">Nothing scheduled.</div>');
  } else {
    var up = all.filter(function (l) { return !isPast(l); });
    var list = coach ? up.filter(function (l) { return upKind === "Privates" ? isPrivate(l) : !isPrivate(l); }) : up;
    if (coach) { var np = up.filter(isPrivate).length; html += '<div class="seg"><button data-kind="Privates" class="' + (upKind === "Privates" ? "on" : "") + '">Privates (' + np + ')</button><button data-kind="Groups" class="' + (upKind === "Groups" ? "on" : "") + '">Groups (' + (up.length - np) + ')</button></div>'; }
    if (!list.length) html += '<div class="empty">Nothing coming up.</div>';
    var lastD = "";
    list.forEach(function (l) {
      var dk = new Date(l.start_at).toDateString();
      if (dk !== lastD) { html += '<div class="dh' + (sameDay(l.start_at, new Date()) ? " today" : "") + '">' + esc(fmtDate(l.start_at, { weekday: "long", month: "long", day: "numeric" })) + '</div>'; lastD = dk; }
      html += agendaCard(l);
    });
  }
  app.innerHTML = shell(html);
  if (calMode === "day") {
    drawPlanner($("#plnr"), dayLs);
    var pb = $(".planner .blk"), pl = $(".planner");
    window.scrollTo(0, dayLs.length && pb ? Math.max(0, pl.getBoundingClientRect().top + window.scrollY + parseFloat(pb.style.top) - 90) : 0);
  }
  app.onclick = function (e) {
    var t;
    if (e.target.closest("#syncbtn")) return syncModal();
    if ((t = e.target.closest("[data-mode]"))) { calMode = t.dataset.mode; calView(); }
    else if ((t = e.target.closest("[data-kind]"))) { upKind = t.dataset.kind; calView(); }
    else if ((t = e.target.closest("[data-a]"))) { calDay = startOfDay(new Date()); calView(); }
    else if ((t = e.target.closest("[data-s]"))) { calDay = new Date(calDay); calDay.setDate(calDay.getDate() + (+t.dataset.s)); calView(); }
    else if ((t = e.target.closest("[data-m]"))) { calDay = new Date(calDay.getFullYear(), calDay.getMonth() + (+t.dataset.m), 1); calView(); }
    else if ((t = e.target.closest("[data-d]"))) { calDay = startOfDay(new Date(+t.dataset.d)); calView(); }
    else if ((t = e.target.closest("[data-f]"))) { var f = t.dataset.f; if (!f) calFilter = {}; else calFilter[f] = !calFilter[f]; calView(); }
    else if ((t = e.target.closest("[data-l]"))) openLessonById(t.dataset.l);
  };
}
function drawPlanner(box, ls) {
  var H = 72, first = 7, last = 20;
  ls.forEach(function (l) { first = Math.min(first, new Date(l.start_at).getHours()); last = Math.max(last, new Date(lEnd(l)).getHours() + 1); });
  var rows = ""; for (var h = first; h <= last; h++) rows += '<div class="hr" style="height:' + H + 'px"><span>' + ((h % 12) || 12) + " " + (h < 12 ? "AM" : "PM") + '</span></div>';
  var placed = [], cluster = [], cend = 0;
  function flush() { var n = cluster.reduce(function (a, c) { return Math.max(a, c.col + 1); }, 1); cluster.forEach(function (c) { c.n = n; placed.push(c); }); cluster = []; }
  ls.forEach(function (l) {
    var st = new Date(l.start_at).getTime(), en = lEnd(l);
    if (st >= cend) flush();
    var col = 0; while (cluster.some(function (c) { return c.col === col && c.end > st; })) col++;
    cluster.push({ l: l, col: col, end: en }); cend = Math.max(cend, en);
  }); flush();
  var blocks = placed.map(function (p) {
    var d = new Date(p.l.start_at), top = ((d.getHours() - first) * 60 + d.getMinutes()) / 60 * H + 13, ht = Math.max(p.l.minutes / 60 * H - 3, 30);
    var names = namesOf(p.l), col = colorOf(sids(p.l)[0]);
    var w = "calc((100% - 70px) / " + p.n + " - 3px)";
    return '<button class="blk" data-l="' + p.l.id + '" style="top:' + top + 'px;height:' + ht + 'px;width:' + w + ';left:calc(62px + (100% - 70px) / ' + p.n + ' * ' + p.col + ');border-color:' + col + ';background:' + col + '2e' + (isPast(p.l) ? ";opacity:.6" : "") + '"><b>' + esc(names.join(", ") || p.l.kind) + '</b>' + (ht > 44 ? '<small>' + esc(p.l.kind + ", " + rangeText(p.l)) + '</small>' : "") + (ht > 64 && p.l.location ? '<small>' + esc(p.l.location) + '</small>' : "") + '</button>';
  }).join("");
  var nowLine = "";
  if (sameDay(calDay, new Date())) { var n = new Date(); var t = ((n.getHours() - first) * 60 + n.getMinutes()) / 60 * H + 13; if (t > 0) nowLine = '<div class="now" style="top:' + t + 'px"></div>'; }
  box.innerHTML = '<div class="planner">' + rows + blocks + nowLine + (ls.length ? "" : '<div class="empty" style="position:absolute;left:0;right:0;top:80px">Open day.</div>') + '</div>';
}

/* ---------- start ---------- */
if (S.session) boot(); else render();
</script>
