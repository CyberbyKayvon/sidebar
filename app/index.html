function stuName(id) { var s = studentById(id); return s ? s.name : "Player"; }
function patchRow(table, id, fields) { return api(table + "?id=eq." + id, { method: "PATCH", json: fields, prefer: "return=minimal" }); }
function delRow(table, id) { return api(table + "?id=eq." + id, { method: "DELETE", prefer: "return=minimal" }); }

function runRecurring() {
  var now = new Date(), key = dayStr(now).slice(0, 7), today = now.getDate(), mname = now.toLocaleDateString(undefined, { month: "long" }), chain = Promise.resolve();
  S.recurring.filter(function (r) { return r.active && (r.last_month || "") < key && today >= r.day_of_month && studentById(r.student_id); }).forEach(function (r) {
    chain = chain.then(function () {
      var ch = { id: newId(), coach_id: S.session.user.id, student_id: r.student_id, kind: r.kind, title: r.title + " " + mname, amount_cents: r.amount_cents, lessons_total: r.kind === "package" ? r.lessons_total : null, lessons_used: 0, created_at: new Date().toISOString() };
      return patchRow("recurring_charges", r.id, { last_month: key }).then(function () { r.last_month = key; return api("charges", { json: [ch], prefer: "return=minimal" }); }).then(function () { S.charges.push(ch); });
    }).catch(function () {});
  });
  return chain;
}

function reportTab(id, box) {

function chatTab(s, box) {

  var shown = {}, first = true;

    return api("messages?student_id=eq." + s.id + "&order=created_at.asc&select=*").then(function (ms) {
      var c = $("#chat"); if (!c) return;

      if (!ms.length && first) c.innerHTML = '<div class="empty">No messages yet. Say hi.</div>';

    vlist();
    $("#va").onclick = function () {
      var t = $("#vt").value.trim(), u = $("#vu").value.trim(); if (!t || !u) { $("#vm").textContent = "Add a title and a link."; return; }
      if (!/^https?:\/\//i.test(u)) u = "https://" + u;
      if (vids.length >= 20) { $("#vm").textContent = "You can add up to 20."; return; }
      var row = { id: newId(), coach_id: me, title: t.slice(0, 80), url: u.slice(0, 500), note: $("#vn").value.trim().slice(0, 200) };
      upsertRow("coach_videos", [row]).then(function () { vids.unshift(row); $("#vt").value = $("#vu").value = $("#vn").value = ""; $("#vm").textContent = ""; vlist(); }).catch(function (e) { $("#vm").textContent = e.message; });
    };
    $("#ppv").onclick = function () {
      coachModal({ coach_id: me, name: S.profile.display_name || "You", academy: S.profile.academy || "", headline: $("#ph").value.trim(), bio: $("#pb").value.trim(), city: $("#pcty").value.trim(), state: $("#pst").value.trim(), specialties: p.specialties, levels: p.levels, lesson_types: p.lesson_types, years: $("#py").value === "" ? null : +$("#py").value, rate_note: $("#pr").value.trim(), accepting: $("#pa").checked, avatar_color: String(p.avatar_color) }, true);
    };
    $("#psv").onclick = function () {
      var row = { coach_id: me, listed: $("#pl").checked, accepting: $("#pa").checked, headline: $("#ph").value.trim().slice(0, 100), bio: $("#pb").value.trim().slice(0, 1200), city: $("#pcty").value.trim(), state: $("#pst").value.trim(), sports: p.sports || ["Tennis"], specialties: p.specialties, levels: p.levels, lesson_types: p.lesson_types, years: $("#py").value === "" ? null : Math.max(0, Math.min(70, +$("#py").value)), rate_note: $("#pr").value.trim().slice(0, 60), avatar_color: String(p.avatar_color) };
      $("#psv").disabled = true;
      (row.listed ? rpcCall("my_coach_code") : Promise.resolve()).then(function () { return upsertRow("coach_profiles", [row]); }).then(function () { $("#pm").className = "small"; $("#pm").textContent = row.listed ? "Saved. You are listed in Find a coach." : "Saved. Your profile is hidden."; $("#psv").disabled = false; })
        .catch(function (e) { $("#pm").className = "err small"; $("#pm").textContent = e.message; $("#psv").disabled = false; });
    };
  }).catch(function (e) { app.innerHTML = shell('<p class="err">' + esc(e.message) + '</p>'); });
}

/* coach: public clinics */
function myClinicsView() {
  var me = S.session.user.id;
  app.innerHTML = shell('<div class="hhead"><a class="small" href="#/">&larr; Home</a><h1>My clinics</h1></div>' + dtabs("myclinics") + '<button class="btn" id="nc">+ Add a public clinic</button><div id="mc"><p class="muted">Loading...</p></div>');
  $("#nc").onclick = function () { clinicForm(null); };
  Promise.all([api("public_clinics?coach_id=eq." + me + "&cancelled=eq.false&select=*&order=starts_at.asc"), api("clinic_signups?select=*&order=created_at.asc&limit=2000")]).then(function (r) {
    var cl = r[0], su = r[1].filter(function (s) { return s.status !== "cancelled"; });
    var box = $("#mc"); if (!box) return;
    if (!cl.length) { box.innerHTML = '<div class="card empty">No public clinics yet. Add one and anyone using Sidebar can sign up. When it fills up, families join a waiting list.</div>'; return; }
    box.innerHTML = '<div class="grid" style="margin-top:12px">' + cl.map(function (c, i) {
      var mine = su.filter(function (s) { return s.clinic_id === c.id; }), inn = mine.filter(function (s) { return s.status === "confirmed"; }).length, w = mine.length - inn;
      return '<a class="card" data-i="' + i + '" style="display:block;cursor:pointer;text-decoration:none;color:inherit"><div class="hd">' + esc(c.title) + '</div><div class="small">' + esc(whenLine(c)) + '</div><div class="small" style="color:var(--court);font-weight:700;margin-top:4px">' + inn + " of " + c.capacity + " in" + (w ? ", " + w + " waiting" : "") + '</div></a>';
    }).join("") + '</div>';
    box.querySelectorAll("[data-i]").forEach(function (el) { el.onclick = function () { var c = cl[+el.dataset.i]; signupsModal(c, su.filter(function (s) { return s.clinic_id === c.id; })); }; });
  }).catch(function (e) { var b = $("#mc"); if (b) b.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
}
function signupsModal(c, list) {
  function draw(mod) {
    var inn = list.filter(function (s) { return s.status === "confirmed"; }), w = list.filter(function (s) { return s.status === "waitlist"; });
    function rows(a, wait) { return a.map(function (s) { return '<div class="row c" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="grow"><b>' + esc(s.player_name) + (s.player_age ? ", " + s.player_age : "") + '</b><div class="small muted">' + esc(s.contact) + '</div>' + (s.note ? '<div class="small muted">' + esc(s.note) + '</div>' : "") + '</div>' + (wait ? '<button class="pill" data-p="' + s.id + '" style="margin-right:6px">Let in</button>' : "") + '<button class="pill" data-r="' + s.id + '">Remove</button></div>'; }).join(""); }
    $("#sg", mod).innerHTML = '<div class="cap">IN (' + inn.length + ' of ' + c.capacity + ')</div>' + (rows(inn, false) || '<p class="small muted">No one yet.</p>') + (w.length ? '<div class="cap" style="margin-top:10px">WAITING LIST</div>' + rows(w, true) : "");
    $("#sg", mod).querySelectorAll("[data-p],[data-r]").forEach(function (b) {
      b.onclick = function () {
        var id = b.dataset.p || b.dataset.r;
        rpcCall(b.dataset.p ? "promote_clinic_signup" : "cancel_clinic_signup", { signup: id }).then(function () { return api("clinic_signups?clinic_id=eq." + c.id + "&status=neq.cancelled&select=*&order=created_at.asc"); }).then(function (n) { list = n; draw(mod); });
      };
    });
  }
  var mod = openModal('<h3 style="margin:0">' + esc(c.title) + '</h3><div class="small muted">' + esc(whenLine(c)) + '</div><div id="sg"></div><button class="btn ghost" id="ce" style="margin-top:12px">Edit clinic</button>', function () { myClinicsView(); });
  draw(mod);
  $("#ce", mod).onclick = function () { mod.remove(); clinicForm(c); };
}
function clinicForm(c) {
  var me = S.session.user.id, d = c ? new Date(c.starts_at) : new Date(Date.now() + 7 * 864e5);
  var loc = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  var mod = openModal('<h3 style="margin:0 0 8px;font-size:20px">' + (c ? "Edit clinic" : "New public clinic") + '</h3><input id="kt" maxlength="80" placeholder="Title, like Saturday Red Ball Clinic" value="' + esc(c ? c.title : "") + '"><textarea id="kd" rows="3" maxlength="600" placeholder="What families should know">' + esc(c ? c.description : "") + '</textarea><input id="ks" type="datetime-local" value="' + loc + '"><div class="row" style="gap:8px"><select id="km">' + [45, 60, 75, 90, 120, 180].map(function (m) { return '<option value="' + m + '"' + ((c ? c.minutes : 90) === m ? " selected" : "") + '>' + (m >= 60 ? hrsText(m) + " hr" : m + " min") + '</option>'; }).join("") + '</select><input id="kc" type="number" min="1" max="200" placeholder="Capacity" value="' + (c ? c.capacity : 8) + '"></div><input id="kl" maxlength="100" placeholder="Courts or club" value="' + esc(c ? c.location : "") + '"><input id="ky" maxlength="60" placeholder="City" value="' + esc(c ? c.city : "") + '"><input id="kp" maxlength="60" placeholder="Price, like $30 per player" value="' + esc(c ? c.price_note : "") + '"><div class="row" style="gap:8px"><input id="kv" maxlength="40" placeholder="Level" value="' + esc(c ? c.level : "") + '"><input id="ka" maxlength="40" placeholder="Ages, like 8 to 11" value="' + esc(c ? c.age_note : "") + '"></div><div id="ke" class="err small"></div><button class="btn" id="kg">Save clinic</button>' + (c ? '<button class="btn ghost" id="kx" style="margin-top:8px;color:#c0392b;border-color:#c0392b">Cancel this clinic</button>' : ""), function () { myClinicsView(); });
  function save(cancelled) {
    var t = $("#kt", mod).value.trim(); if (!t) { $("#ke", mod).textContent = "Add a title."; return; }
    var row = { id: c ? c.id : newId(), coach_id: me, title: t, description: $("#kd", mod).value.trim(), starts_at: new Date($("#ks", mod).value).toISOString(), minutes: +$("#km", mod).value, location: $("#kl", mod).value.trim(), city: $("#ky", mod).value.trim(), capacity: Math.max(1, Math.min(200, +$("#kc", mod).value || 8)), price_note: $("#kp", mod).value.trim(), level: $("#kv", mod).value.trim(), age_note: $("#ka", mod).value.trim(), cancelled: !!cancelled };
    upsertRow("public_clinics", [row]).then(function () { mod.remove(); myClinicsView(); }).catch(function (e) { $("#ke", mod).textContent = e.message; });
  }
  $("#kg", mod).onclick = function () { save(false); };
  if (c) $("#kx", mod).onclick = function () { if (confirm("Cancel this clinic? It disappears for families.")) save(true); };
}
</script>
</body>
</html>
